# Render Blueprint: creates the web service with a persistent disk for the
# database and logo files. Render asks for the values marked sync: false.
services:
  - type: web
    name: vectorly
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run seed && npm start
    healthCheckPath: /
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
